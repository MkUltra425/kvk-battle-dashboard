name: Power data refresh
on:
  push:
    paths:
      - 'scripts/refresh-power.py'
      - '.github/workflows/refresh-power.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: power-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate all power boards
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
        run: python scripts/refresh-power.py
      - name: Save current data and browser refresh fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html power-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Mightpulse power data and use server-fetched snapshot"
          git pull --rebase origin main
          git push

  }

  async function refreshMemberPower() {
    if (!requireEdit() || powerSyncing) return;
    const apiKey = "kss_V3NLfiWb1737zdnmLecSHNBqEtwZ0mu_l-L0XimK2xc";
    if (!apiKey?.trim()) return;
    setPowerSyncing(true);
    let received = 0, matched = 0;
    const updates = {};
    try {
      for (const field of MEMBER_POWER_FIELDS) {
        setPowerSyncMsg(`Mightpulse: loading ${field}… (${received}/${MEMBER_POWER_FIELDS.length})`);
        const response = await fetch(`https://api.mightpulse.com/v1/kingdoms/1884/ranks?board=${field}&limit=100`, {
          headers: { Authorization: `Bearer ${apiKey.trim()}` }, cache: "no-store"
        });
        if (!response.ok) throw new Error(`Mightpulse returned ${response.status}. ${received} boards loaded before refresh stopped.`);
        const data = await response.json();
        if (data.ok === false) throw new Error("Mightpulse could not return leaderboard data.");
        const entries = [];
        function collect(value) {
          if (!value || typeof value !== "object") return;
          if (!Array.isArray(value) && value.governor_id != null && value.score != null) { entries.push(value); return; }
          for (const child of Object.values(value)) if (child && typeof child === "object") collect(child);
        }
        collect(data);
        if (!entries.length) throw new Error(`No readable entries returned for ${field}; existing values were preserved.`);
        const scores = new Map(entries.map(entry => [String(entry.governor_id), Number(entry.score)]).filter(([,score]) => Number.isFinite(score) && score >= 0));
        for (const m of members) {
          const governorId = m.governorId || (/^\d{7,10}$/.test(String(m.id)) ? m.id : null);
          if (!governorId) continue;
          const score = scores.get(String(governorId));
          updates[`members/${m.id}/${field}`] = score === undefined ? null : score;
          if (score !== undefined) matched++;
        }
        received++;
      }
      const fetchedAt = new Date().toISOString();
      for (const m of members) {
        if (Object.keys(updates).some(path => path.startsWith(`members/${m.id}/`))) {
          updates[`members/${m.id}/powerUpdatedAt`] = fetchedAt;
          updates[`members/${m.id}/powerSource`] = "Mightpulse";
        }
      }
      if (Object.keys(updates).length) await db.ref().update(updates);
      setPowerSyncMsg(`Mightpulse: refreshed all 7 boards, matched ${matched} power values. — means not available in the returned top 100. Source data may be cached.`);
    } catch (e) { setPowerSyncMsg(`${e.message === "Failed to fetch" ? "Browser could not access Mightpulse. Use Load Power Snapshot for the included data." : e.message} No partial refresh was saved.`); }
    finally { setPowerSyncing(false); }
  }

  async function loadAvatars() {
    if (!requireEdit()) return;
    const missing = members.filter(m => !m.avatarUrl && m.id);
    if (!missing.length) {
      setAvatarMsg({ text: "✓ All members already have avatars", ok: true });
      setTimeout(() => setAvatarMsg(null), 5000);
      return;
    }
    setLoadingAvatars(true);
    setAvatarMsg({ text: `Loading avatars for ${missing.length} members… (0/${missing.length})`, ok: true });

    const API_TOKEN = "jp_f05159a41aae673e635088bb9531ce84db663a0e";
    const headers = { Authorization: `Bearer ${API_TOKEN}` };
    const delay = ms => new Promise(res => setTimeout(res, ms));

    let done = 0, failed = 0;
    const updates = {};

    for (const m of missing) {
      // Use the Governor ID stored as m.id if it's a large number (API player id),
      // otherwise we can't look them up individually
      const govId = m.governorId || (String(m.id).length >= 7 ? m.id : null);
      if (!govId) { failed++; done++; continue; }

      try {
        await delay(300); // ~3 requests/sec — stays well under rate limit
        const r = await fetch(
          `https://jeabslist.com/api/v1/players/${govId}?cached=1`,
          { headers }
        );
        if (r.ok) {
          const p = await r.json();
          if (p.avatar_url) {
            updates[`members/${m.id}`] = { ...m, avatarUrl: p.avatar_url };
          }
        } else { failed++; }
      } catch { failed++; }

      done++;
      if (done % 5 === 0) {
        setAvatarMsg({ text: `Loading avatars… (${done}/${missing.length})`, ok: true });
      }
    }

    if (Object.keys(updates).length) await db.ref().update(updates);

    const loaded = Object.keys(updates).length;
    setAvatarMsg({
      text: `✓ Loaded ${loaded} avatar${loaded !== 1 ? "s" : ""}${failed ? ` · ${failed} skipped (no Governor ID)` : ""}`,
      ok: loaded > 0,
    });
    setLoadingAvatars(false);
    setTimeout(() => setAvatarMsg(null), 10000);
  }

  // ── Derived stats ──────────────────────────────────────────────────────
  const avail        = members.filter(m => m.available === "Full").length;
  const leaders      = members.filter(m => m.role === "Rally Leader").length;
  const joiners      = members.filter(m => m.role === "Rally Joiner").length;
  const friendlyAsgn = Object.values(assignments).filter(a => a.type === "friendly").length;
  const enemyAsgn    = Object.values(assignments).filter(a => a.type === "enemy").length;
  const allianceDist = [...new Set(members.map(m => m.alliance).filter(Boolean))].map(a => ({ label: a, value: members.filter(m => m.alliance === a).length })).sort((a, b) => b.value - a.value);
  const availDist    = AVAILABILITY_OPTS.map(o => ({ label: o, value: members.filter(m => m.available === o).length }));
  const targetDist   = PRIMARY_TARGETS.map(t => ({ label: t, value: members.filter(m => m.primaryTarget === t).length }));

  let filtered = members.map(m => ({ ...m, rallyScore: rallyScore(m) })).filter(m => {
    if (MEMBER_FILTER_COLUMNS.some(([field]) => memberFilters[field] && !memberFilters[field].includes(memberFilterValue(m[field])))) return false;
    if (search && !m.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }).sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === "tc") {
      const level = value => {
        const text = String(value ?? "").trim().toUpperCase();
        const tg = text.match(/^TG\s*(\d+)$/);
        if (tg) return 30 + Number(tg[1]);
        const n = Number(text);
        if (!text || !Number.isFinite(n)) return null;
        return n >= 35 ? 30 + Math.floor((n - 30) / 5) : n;
      };
      av = level(av); bv = level(bv);
      if (av === null || bv === null) return av === bv ? 0 : av === null ? 1 : -1;
      return (av - bv) * sortDir;
    }
    if (MEMBER_POWER_FIELDS.includes(sortKey) || sortKey === "rallyScore") {
      const numeric = value => value === null || value === undefined || String(value).trim() === "" ? null : Number(String(value).replace(/,/g, ""));
      av = numeric(av); bv = numeric(bv);
      const aMissing = av === null || !Number.isFinite(av), bMissing = bv === null || !Number.isFinite(bv);
      if (aMissing || bMissing) return aMissing === bMissing ? 0 : aMissing ? 1 : -1;
      return (av - bv) * sortDir;
    }
    if (typeof av === "string") av = av.toLowerCase();
    if (typeof bv === "string") bv = bv.toLowerCase();
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  function toggleSort(k) { if (sortKey === k) setSortDir(d => -d); else { setSortKey(k); setSortDir(1); } }
  const thSt = { padding: "10px 10px", fontSize: 10, color: C.textDim, textAlign: "left", borderBottom: `1px solid ${C.panelBorder}`, cursor: "pointer", textTransform: "uppercase", letterSpacing: 1.2, userSelect: "none", whiteSpace: "nowrap", fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", fontWeight: 700 };

  // ── Loading screen ─────────────────────────────────────────────────────
  if (loading) return (
    <div style={{ minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16, fontFamily: "'Bebas Neue', sans-serif" }}>
      <div style={{ fontSize: 36, color: C.accent, letterSpacing: 4 }}>⚔ KINGSHOT KvK</div>
      <div style={{ fontSize: 14, color: C.textDim, letterSpacing: 2 }}>CONNECTING TO DATABASE…</div>
      <div style={{ width: 180, height: 3, background: "rgba(255,255,255,0.08)", borderRadius: 99, overflow: "hidden" }}>
        <div style={{ height: "100%", background: C.accent, borderRadius: 99, animation: "loading 1.4s ease-in-out infinite", width: "40%" }} />
      </div>
      <style>{`@keyframes loading { 0%{margin-left:-40%} 100%{margin-left:100%} } @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');`}</style>
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'Syne','Segoe UI',sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700;800&family=Roboto+Condensed:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #080c14; }
        ::-webkit-scrollbar-thumb { background: #1a2a3a; border-radius: 3px; }
        select option { background: #0d1520; }
        .cell-edit { background: transparent; border: 1px solid transparent; border-radius: 6px; color: inherit; padding: 4px 6px; font-size: 12px; width: 100%; box-sizing: border-box; outline: none; transition: background 0.15s, border-color 0.15s; font-family: inherit; }
        .cell-edit:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
        .cell-edit:focus { background: rgba(255,255,255,0.09); border-color: rgba(167,139,250,0.55); }
        select.cell-edit { cursor: pointer; }
        select.cell-edit option { color: #e2e8f3; background: #0d1520; font-weight: 400; }
        .cell-edit::placeholder { color: rgba(255,255,255,0.3); }
      `}</style>

      {/* Passphrase modal */}
      {showAuth && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 2000, display: "flex", alignItems: "center", justifyContent: "center" }}
          onClick={e => { if (e.target === e.currentTarget) { setShowAuth(false); setAuthInput(""); setAuthError(false); } }}>
          <div style={{ background: "#0d1520", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 16, padding: 28, width: 300, boxShadow: "0 20px 60px rgba(0,0,0,0.6)" }}>
            <div style={{ fontFamily: "'Bebas Neue'", fontSize: 22, color: C.accent, letterSpacing: 2, marginBottom: 6 }}>EDIT MODE</div>
            <div style={{ fontSize: 12, color: C.textDim, marginBottom: 16 }}>Enter the passphrase to enable editing</div>
            <input type="password" autoFocus
              style={{ ...inputSt, marginBottom: authError ? 6 : 14, fontSize: 14 }}
              value={authInput} placeholder="Passphrase..."
              onChange={e => { setAuthInput(e.target.value); setAuthError(false); }}
              onKeyDown={e => e.key === "Enter" && tryAuth()} />
            {authError && <div style={{ fontSize: 11, color: C.red, marginBottom: 10 }}>✕ Incorrect passphrase</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={tryAuth} style={{ ...btnSt, background: C.accentDim, color: C.accent, flex: 1, padding: "9px 0", fontWeight: 800, fontSize: 13 }}>Unlock</button>
              <button onClick={() => { setShowAuth(false); setAuthInput(""); setAuthError(false); }} style={{ ...btnSt, padding: "9px 16px" }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div style={{ position: "sticky", top: 0, zIndex: 100, flexShrink: 0, boxShadow: "0 3px 12px #0004", background: "linear-gradient(90deg,#0d1520,#101c2c 50%,#0d1520)", borderBottom: `1px solid ${C.panelBorder}`, padding: isMobile ? "0 12px" : "0 24px", display: "flex", alignItems: "center", gap: isMobile ? 8 : 20, height: isMobile ? 50 : 56 }}>
        <div style={{ fontFamily: "'Bebas Neue'", fontSize: isMobile ? 18 : 26, color: C.accent, letterSpacing: 2 }}>⚔ KINGSHOT KvK</div>
        {!isMobile && <div style={{ fontSize: 11, color: C.textDim, borderLeft: `1px solid ${C.panelBorder}`, paddingLeft: 16 }}>ALLIANCE COMMAND CENTER</div>}
        <div style={{ flex: 1 }} />
        <LanguageSelector isMobile={isMobile} />
        <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: C.green }}>
          <div style={{ width: 7, height: 7, borderRadius: "50%", background: C.green, boxShadow: `0 0 6px ${C.green}` }} />
          {!isMobile && "LIVE"}
        </div>
        {/* Lock / Unlock button */}
        <button onClick={() => editMode ? setEditMode(false) : setShowAuth(true)} style={{
          ...btnSt, padding: "5px 12px", fontSize: 11, fontWeight: 700,
          fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.5,
          background: editMode ? "rgba(52,211,153,0.15)" : "rgba(255,255,255,0.06)",
          color: editMode ? C.green : C.textDim,
          border: editMode ? `1px solid ${C.green}44` : "1px solid rgba(255,255,255,0.10)",
        }}>
          {editMode ? "🔓 EDITING" : "🔒 VIEW ONLY"}
        </button>
        {[["map", isMobile ? "🗺" : "🗺 Battle Map"], ["members", isMobile ? "👥" : "👥 Members"], ["dashboard", isMobile ? "📊" : "📊 Dashboard"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{ ...btnSt, padding: isMobile ? "6px 10px" : "6px 18px", fontSize: isMobile ? 18 : 13, fontWeight: 700, fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.5, background: tab === k ? C.accentDim : "transparent", color: tab === k ? C.accent : C.textDim, border: tab === k ? `1px solid ${C.accent}44` : "1px solid transparent" }}>{label}</button>
        ))}
      </div>

      <div style={{ padding: isMobile ? 12 : 20, maxWidth: 1600, margin: "0 auto" }}>

        {/* ── Dashboard ── */}
        {tab === "dashboard" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(8, 1fr)", gap: 12, marginBottom: 20 }}>
              <StatCard label="Total Members" value={members.length} sub={`${avail} full availability`} />
              <StatCard label="Full Avail." value={avail} sub={`${Math.round(avail / (members.length || 1) * 100)}% ready`} color={C.green} />
              <StatCard label="Rally Leaders" value={leaders} color={C.gold} />
              <StatCard label="Rally Joiners" value={joiners} color={C.blue} />
              <StatCard label="Friendly Tiles" value={friendlyAsgn} sub="on map" color={C.blue} />
              <StatCard label="Enemy Tiles" value={enemyAsgn} sub="tracked" color={C.red} />
              <StatCard label="Off-Map" value={members.length - friendlyAsgn} sub="unpositioned" color={C.textDim} />
              <StatCard label="Coverage" value={`${Math.round(friendlyAsgn / 180 * 100)}%`} sub={`${friendlyAsgn} / 180 tiles`} color={C.accent} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fill,minmax(260px,1fr))", gap: 16, marginBottom: 20 }}>
              {[
                { title: "AVAILABILITY", content: <>
                  {availDist.map(({ label, value }) => {
                    const col = { Full: C.green, "1st Half": C.blue, "2nd Half": C.gold, "On/Off": C.red }[label] || C.textDim;
                    return <MiniBar key={label} label={label} value={value} max={members.length} color={col} />;
                  })}
                </> },
                { title: "ROLES", content: <><DonutSlice label="Rally Leaders" value={leaders} total={members.length} color={C.gold} /><DonutSlice label="Rally Joiners" value={joiners} total={members.length} color={C.blue} /></> },
                { title: "ALLIANCES", content: allianceDist.length ? allianceDist.map(({ label, value }) => <MiniBar key={label} label={label} value={value} max={members.length} color={allianceColor(label)} />) : <div style={{ fontSize: 11, color: C.textDim }}>No alliances set yet</div> },
                { title: "PRIMARY TARGETS", content: targetDist.map(({ label, value }) => {
                  const col = { Castle: C.accent, "Turret (N)": "#20d0d0", "Turret (E)": "#c060ff", "Turret (S)": "#ff8040", "Turret (W)": "#40c080" }[label] || C.textDim;
                  return <MiniBar key={label} label={label} value={value} max={members.length} color={col} />;
                }) },
                { title: "MAP OCCUPANCY", content: <><DonutSlice label="Friendly" value={friendlyAsgn} total={friendlyAsgn + enemyAsgn + 1} color={C.blue} /><DonutSlice label="Enemy" value={enemyAsgn} total={friendlyAsgn + enemyAsgn + 1} color={C.red} /></> },
                { title: "TC LEVELS", content: TC_LEVELS.slice().reverse().map(tg => { const cnt = members.filter(m => m.tc === tg).length; return cnt > 0 ? <MiniBar key={tg} label={tg} value={cnt} max={members.length} color={C.accent} /> : null; }) },
              ].map(({ title, content }) => (
                <div key={title} style={{ background: C.panel, border: `1px solid ${C.panelBorder}`, borderRadius: 10, padding: 18 }}>
                  <div style={{ fontFamily: "'Bebas Neue'", fontSize: 15, color: C.accent, letterSpacing: 1, marginBottom: 12 }}>{title}</div>
                  {content}
                </div>
              ))}
            </div>
            <div style={{ background: C.panel, border: `1px solid ${C.panelBorder}`, borderRadius: 10, padding: 18 }}>
              <div style={{ fontFamily: "'Bebas Neue'", fontSize: 15, color: C.accent, letterSpacing: 1, marginBottom: 12 }}>QUICK ROSTER</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {members.map(m => (
                  <div key={m.id} style={{ background: m.available === "Full" ? "#0a2a1a" : "#2a0a0a", border: `1px solid ${m.available === "Full" ? C.green : C.red}33`, borderRadius: 6, padding: "6px 12px", fontSize: 12 }}>
                    <span style={{ fontWeight: 700 }}>{m.name}</span>
                    <span style={{ color: C.textDim, marginLeft: 6, fontSize: 11 }}>{m.tc}</span>
                    <span style={{ marginLeft: 6 }}><Pill color={allianceColor(m.alliance)}>{m.alliance || "—"}</Pill></span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ── Members ── */}
        {tab === "members" && (
          <div>
            <MemberSummary members={members} alliances={alliances} kvkAlliances={kvkAlliances} />
            {editMode && (
            <div style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 16, flexWrap: "wrap" }}>
              <AddMemberButton onAdd={addMember} alliances={alliances} />
              <button onClick={loadPowerSnapshot} disabled={powerSyncing} title={`Fetched ${MEMBER_POWER_SNAPSHOT.fetched_at}`} style={{ ...btnSt, padding: "7px 16px", color: C.green, fontWeight: 700 }}>Load Power Snapshot</button>
              <button onClick={refreshMemberPower} disabled={powerSyncing} style={{ ...btnSt, padding: "7px 16px", color: C.blue, fontWeight: 700 }}>{powerSyncing ? "Refreshing Power…" : "↻ Refresh Power"}</button>
              <CsvUploadButton onImport={importMembers} />
              <AllianceManager alliances={alliances} onAdd={addAlliance} onRemove={removeAlliance} onColorChange={updateAllianceColor} />
              <KvkAllianceManager kvkAlliances={kvkAlliances} onAdd={addKvkAlliance} onRemove={removeKvkAlliance} onColorChange={updateKvkAllianceColor} />
              <button onClick={clearAllMembers} style={{ ...btnSt, background: "rgba(248,113,113,0.15)", color: C.red, padding: "7px 20px", fontWeight: 700, fontSize: 13, fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.5, border: `1px solid ${C.red}33` }}>
                🗑 Clear All
              </button>
              <button onClick={syncFromAPI} disabled={syncing} style={{ ...btnSt, background: "rgba(96,165,250,0.15)", color: C.blue, padding: "7px 20px", fontWeight: 700, fontSize: 13, fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.5, border: `1px solid ${C.blue}44`, opacity: syncing ? 0.6 : 1 }}>
                {syncing ? "⟳ Syncing…" : "⟳ Sync from API"}
              </button>
              <button onClick={loadAvatars} disabled={loadingAvatars} style={{ ...btnSt, background: "rgba(167,139,250,0.15)", color: C.accent, padding: "7px 20px", fontWeight: 700, fontSize: 13, fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.5, border: `1px solid ${C.accent}44`, opacity: loadingAvatars ? 0.6 : 1 }}>
                {loadingAvatars ? "⟳ Loading…" : "🖼 Load Avatars"}
              </button>
            </div>
            )}
            {editMode && powerSyncMsg && <div role="status" style={{ marginBottom: 10, fontSize: 12, color: C.textDim }}>{powerSyncMsg}</div>}
            {editMode && syncMsg && (
              <div style={{ marginBottom: 10, padding: "8px 14px", borderRadius: 8, fontSize: 11, fontWeight: 600, background: syncMsg.ok ? `${C.green}18` : `${C.gold}18`, border: `1px solid ${syncMsg.ok ? C.green : C.gold}44`, color: syncMsg.ok ? C.green : C.gold }}>
                {syncMsg.text}
              </div>
            )}
            {editMode && avatarMsg && (
              <div style={{ marginBottom: 10, padding: "8px 14px", borderRadius: 8, fontSize: 11, fontWeight: 600, background: avatarMsg.ok ? `${C.accent}18` : `${C.gold}18`, border: `1px solid ${avatarMsg.ok ? C.accent : C.gold}44`, color: avatarMsg.ok ? C.accent : C.gold }}>
                {avatarMsg.text}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
              <input style={{ ...inputSt, flex: "1 1 140px", minWidth: 0 }} placeholder="🔍 Search name…" value={search} onChange={e => setSearch(e.target.value)} />
              <span style={{ fontSize: 12, color: C.textDim, flexShrink: 0 }}>{filtered.length}/{members.length}</span>
            </div>
            {isMobile && <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
              {MEMBER_FILTER_COLUMNS.map(([field, label]) => <div key={field}><MemberColumnFilter showLabel field={field} label={label} members={members} selected={memberFilters[field]} onChange={values => setMemberFilter(field, values)} /></div>)}
            </div>}
            {isMobile ? (
              <div>
                {filtered.length === 0 && <div style={{ textAlign: "center", color: C.textDim, padding: 40 }}>No members match filters</div>}
                {filtered.map(m => (
                  <MemberCard key={m.id} m={m} alliances={alliances} teams={teams} kvkAlliances={kvkAlliances} onUpdate={updateMember} onDelete={deleteMember} />
                ))}
              </div>
            ) : (
            <div style={{ overflowX: "auto", overflowY: "auto", maxHeight: "calc(100vh - 200px)", borderRadius: 10 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", background: C.panel, borderRadius: 10 }}>
                <thead>
                  <tr style={{ background: "#0a1820" }}>
                    {[["name","Name"],["alliance","Alliance"],["tc","TC Level"],["available","Availability"],["role","Role"],["primaryTarget","Primary Target"],["kvkAlliance","KvK Alliance"],["rallyScore","Rally Score (est.)"],[null,""]].map(([k, label]) => (
                      <th key={label} style={{ ...thSt, position: "sticky", top: 0, background: "#0a1820", zIndex: k === "name" ? 12 : 10, left: k === "name" ? 0 : undefined, minWidth: k === "name" ? 210 : undefined, boxShadow: "0 1px 0 rgba(255,255,255,0.08)" }}><span style={{ display: "inline-flex", alignItems: "center", gap: 2 }}><span onClick={() => k && toggleSort(k)}>{label}{k && sortKey === k ? (sortDir === 1 ? " ↑" : " ↓") : ""}</span>{k && k !== "name" && k !== "rallyScore" && !MEMBER_POWER_FIELDS.includes(k) && <MemberColumnFilter field={k} label={label} members={members} selected={memberFilters[k]} onChange={values => setMemberFilter(k, values)} />}</span></th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(m => (
                    <MemberRow key={m.id} m={m} alliances={alliances} teams={teams} kvkAlliances={kvkAlliances} onUpdate={updateMember} onDelete={deleteMember} />
                  ))}
                  {!filtered.length && <tr><td colSpan={9} style={{ padding: 40, textAlign: "center", color: C.textDim }}>No members match filters</td></tr>}
                </tbody>
              </table>
            </div>
            )}
          </div>
        )}

        {/* ── Map ── */}
        {tab === "map" && (
          <div>
            <div style={{ marginBottom: isMobile ? 10 : 16 }}>
              <div style={{ fontFamily: "'Bebas Neue'", fontSize: isMobile ? 20 : 24, color: C.accent, letterSpacing: 3, marginBottom: 4 }}>KVK BATTLE MAP</div>
              {!isMobile && <div style={{ fontSize: 12, color: C.textDim }}>Click any gray tile to assign a member or mark an enemy. Changes sync live to all users.</div>}
            </div>

            {/* Roster progress removed from map tab */}

            <div style={{
              background: "rgba(255,255,255,0.04)",
              backdropFilter: "blur(20px)",
              WebkitBackdropFilter: "blur(20px)",
              border: "1px solid rgba(255,255,255,0.09)",
              borderRadius: 18, padding: isMobile ? 10 : 20,
              boxShadow: "0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07)",
            }}>
              <CastleMap members={members} assignments={assignments} setAssignments={fbSetAssignments} isMobile={isMobile} viewportWidth={windowWidth} kvkAlliances={kvkAlliances} />
            </div>

            {/* Join Rally + Garrison Support side by side, then strategy guide */}
            <div style={{ marginTop: 16 }}>
              <BattleGuide />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>

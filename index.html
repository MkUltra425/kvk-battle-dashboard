// ── CSV Import Helpers ──────────────────────────────────────────────────────
const CSV_HEADER_ALIASES = {
  name: "name", membername: "name", member: "name",
  tc: "tc", tclevel: "tc", townhall: "tc", th: "tc",
  available: "available", availability: "available",
  role: "role",
  alliance: "alliance",
  team: "team",
  kvkalliance: "kvkAlliance", kvk: "kvkAlliance", kvkteam: "kvkAlliance",
  primarytarget: "primaryTarget", target: "primaryTarget", primarytargets: "primaryTarget",
  notes: "notes", note: "notes",
};

function normalizeHeader(h) { return h.trim().toLowerCase().replace(/[^a-z]/g, ""); }

function parseCSVLine(line) {
  const result = [];
  let cur = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ",") { result.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (!lines.length) return [];
  const headers = parseCSVLine(lines[0]).map(h => CSV_HEADER_ALIASES[normalizeHeader(h)] || null);
  return lines.slice(1).map(line => {
    const values = parseCSVLine(line);
    const row = {};
    headers.forEach((key, i) => { if (key) row[key] = (values[i] || "").trim(); });
    return row;
  });
}

function matchOption(value, options, fallback) {
  if (!value) return fallback;
  const v = value.trim().toLowerCase();
  return options.find(o => o.toLowerCase() === v) || fallback;
}

function rowToMember(row) {
  if (!row.name) return null;
  return {
    id: uid(),
    name: row.name,
    tc: matchOption(row.tc, TC_LEVELS, "TG1"),
    available: matchOption(row.available, AVAILABILITY_OPTS, "") || "",
    role: matchOption(row.role, ROLES, "") || "",
    alliance: row.alliance || "",
    team: row.team || "",
    kvkAlliance: row.kvkAlliance || "",
    primaryTarget: matchOption(row.primaryTarget, PRIMARY_TARGETS, "Castle"),
    notes: row.notes || "",
  };
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, "0");
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function randomAllianceColor() { return hslToHex(Math.floor(Math.random() * 360), 70, 65); }

// ── CSV Upload ───────────────────────────────────────────────────────────────
function CsvUploadButton({ onImport }) {
  const fileRef = useRef(null);
  const [status, setStatus] = useState(null);

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const rows = parseCSV(evt.target.result);
        const newMembers = rows.map(rowToMember).filter(Boolean);
        if (newMembers.length) { onImport(newMembers); setStatus({ count: newMembers.length }); }
        else setStatus({ count: 0, error: "No valid rows found (need a 'name' column)" });
      } catch {
        setStatus({ count: 0, error: "Could not parse that CSV" });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  return (
    <div style={{ display: "inline-flex", flexDirection: "column", gap: 4, verticalAlign: "top" }}>
      <input ref={fileRef} type="file" accept=".csv" onChange={handleFile} style={{ display: "none" }} />
      <button onClick={() => fileRef.current?.click()} style={{ ...btnSt, background: C.blueDim, color: C.blue, padding: "7px 20px", fontWeight: 700, fontSize: 13, fontFamily: "'Roboto Condensed', 'Arial Narrow', sans-serif", letterSpacing: 0.5 }}>
        ⇪ Upload CSV
      </button>
      {status && (
        <span style={{ fontSize: 10, color: status.error ? C.red : C.green }}>
          {status.error || `Imported ${status.count} member${status.count === 1 ? "" : "s"}`}
        </span>
      )}
    </div>
  );
}

// ── Tile Assignment Panel ──────────────────────────────────────────────────
function TilePanel({ modal, members, assignments, onFriendly, onEnemy, onClear, onClose, isMobile }) {
  const [tab, setTab] = useState("friendly");
  const [sel, setSel] = useState("");
  const [en, setEn] = useState({ name: "", kingdom: "", threat: "Scout", notes: "" });
  const existing = modal?.existing;
  const assignedIds = new Set(Object.values(assignments).filter(a => a.type === "friendly" && !a.placeholder && a.member).map(a => a.member.id));
  if (!modal) return null;
  const panelStyle = isMobile ? {
    position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 200,
    background: "#0d1520f8", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)",
    border: `1px solid ${C.accent}66`, borderRadius: "18px 18px 0 0",
    padding: 20, maxHeight: "85vh", overflowY: "auto",
    boxShadow: "0 -8px 40px rgba(0,0,0,0.5)",
  } : {
    background: C.panel, border: `2px solid ${C.accent}88`,
    borderRadius: 10, padding: 20, width: 285, flexShrink: 0,
  };
  return (
    <>
      {isMobile && <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 199 }} />}
      <div style={panelStyle}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ fontFamily: "'Bebas Neue'", fontSize: 20, color: C.accent, letterSpacing: 1 }}>TILE [{modal.r},{modal.c}]</span>
        <button onClick={onClose} style={{ ...btnSt, padding: "2px 9px", fontSize: 13 }}>✕</button>
      </div>
      {existing && (
        <div style={{ background: existing.type === "friendly" ? "#0a2a4a" : C.redDim, border: `1px solid ${existing.type === "friendly" ? C.blue : C.red}55`, borderRadius: 6, padding: "8px 12px", marginBottom: 12 }}>
          <div style={{ fontWeight: 700, color: existing.type === "friendly" ? C.blue : C.red, fontSize: 13, marginBottom: 4 }}>
            {existing.type === "friendly" ? `🤝 ${existing.member?.name || "Placeholder"}` : `⚔ ${existing.name || "Enemy"}`}
          </div>
          {existing.type === "friendly" && existing.member && <div style={{ fontSize: 11, color: C.textDim }}>{existing.member.role} · {existing.member.alliance}</div>}
          {existing.type === "enemy" && existing.kingdom && <div style={{ fontSize: 11, color: C.textDim }}>{existing.kingdom} · {existing.threat}</div>}
          <button onClick={() => onClear(modal.r, modal.c)} style={{ ...btnSt, background: C.redDim, color: C.red, marginTop: 8, width: "100%", padding: 4, fontSize: 11 }}>Clear Tile</button>
        </div>
      )}
      <div style={{ display: "flex", gap: 4, marginBottom: 14 }}>
        {["friendly","enemy"].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{ ...btnSt, flex: 1, textTransform: "capitalize", background: tab === t ? (t === "friendly" ? "#0a2a4a" : C.redDim) : "#1a2a3a", color: tab === t ? (t === "friendly" ? C.blue : C.red) : C.textDim }}>
            {t === "friendly" ? "🤝 Friendly" : "⚔ Enemy"}
          </button>
        ))}
      </div>
      {tab === "friendly" && (
        <>
          <div style={{ fontSize: 10, color: C.textDim, marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.8 }}>Select member</div>
          <select style={{ ...inputSt, marginBottom: 10 }} value={sel} onChange={e => setSel(e.target.value)}>
            <option value="">-- Choose member --</option>
            {[...members].sort((a, b) => a.name.localeCompare(b.name)).map(m => <option key={m.id} value={m.id}>{m.name} ({m.alliance}){assignedIds.has(m.id) ? " ★" : ""}</option>)}
          </select>
          {sel && (() => { const m = members.find(x => x.id === +sel); return m ? (
            <div style={{ background: "#0a1820", borderRadius: 6, padding: "10px 12px", marginBottom: 12, fontSize: 11 }}>
              <div style={{ fontWeight: 800, color: C.text, marginBottom: 6 }}>{m.name}</div>
              <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                <Pill color={roleColor(m.role)}>{m.role === "Rally Leader" ? "Leader" : "Joiner"}</Pill>
                <Pill color={allianceColor(m.alliance)}>{m.alliance || "—"}</Pill>
                <Pill color={m.available ? C.green : C.red}>{m.available ? "Avail." : "Busy"}</Pill>
              </div>
            </div>
          ) : null; })()}
          <button onClick={() => sel && onFriendly(modal.r, modal.c, +sel)} disabled={!sel}
            style={{ ...btnSt, width: "100%", background: sel ? "#0a2a4a" : "#1a2a3a", color: sel ? C.blue : C.textDim, padding: 8, fontWeight: 800 }}>
            Assign to Tile
          </button>
        </>
      )}
      {tab === "enemy" && (
        <>
          {[["name","Enemy Name","e.g. KingSlayer"],["kingdom","Kingdom / Alliance","e.g. K99 · Alliance"]].map(([k,label,ph]) => (
            <div key={k} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10, color: C.textDim, marginBottom: 3, textTransform: "uppercase", letterSpacing: 0.8 }}>{label}</div>
              <input style={inputSt} placeholder={ph} value={en[k]} onChange={e => setEn(p => ({ ...p, [k]: e.target.value }))} />
            </div>
          ))}
          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 10, color: C.textDim, marginBottom: 3, textTransform: "uppercase", letterSpacing: 0.8 }}>Threat Type</div>
            <select style={inputSt} value={en.threat} onChange={e => setEn(p => ({ ...p, threat: e.target.value }))}>{THREAT_TYPES.map(t => <option key={t}>{t}</option>)}</select>
          </div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 10, color: C.textDim, marginBottom: 3, textTransform: "uppercase", letterSpacing: 0.8 }}>Notes</div>
            <input style={inputSt} placeholder="Additional intel..." value={en.notes} onChange={e => setEn(p => ({ ...p, notes: e.target.value }))} />
          </div>
          <button onClick={() => onEnemy(modal.r, modal.c, en)} style={{ ...btnSt, width: "100%", background: C.redDim, color: C.red, padding: 8, fontWeight: 800 }}>Mark as Enemy</button>
        </>
      )}
    </div>
    </>
  );
}

      </div>
      <div style={{ overflowY: "auto", minHeight: 0 }}>
        {values.map(value => <label key={value} style={{ display: "flex", alignItems: "center", gap: 9, padding: "7px 2px", cursor: "pointer", overflowWrap: "anywhere", color: memberFilterColor(field, value), fontWeight: 700, fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.2 }}>
          <input type="checkbox" style={{ accentColor: memberFilterColor(field, value), flexShrink: 0 }} checked={!selected || selected.includes(value)} onChange={e => {

            onChange(next.length === values.length ? null : next);
          }} />{value || "(Blank)"}
        </label>)}
      </div>
    </div>, document.body)}
  </>;
}

function BattleGuide() {
  const [guideImages, setGuideImages] = useState({ joinRally: [null,null,null], garrison: [null,null,null] });

  useEffect(() => {
    const handler = snap => {
      const data = snap.val();
      if (data) setGuideImages({ joinRally: data.joinRally || [null,null,null], garrison: data.garrison || [null,null,null] });
    };
    db.ref("guideImages").on("value", handler);
    return () => db.ref("guideImages").off("value", handler);
  }, []);

  function uploadImage(sectionKey, idx, file) {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const SIZE = 220;
        const canvas = document.createElement("canvas");
        canvas.width = SIZE; canvas.height = SIZE;
        const ctx = canvas.getContext("2d");
        const min = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, SIZE, SIZE);
        const b64 = canvas.toDataURL("image/jpeg", 0.78);
        setGuideImages(prev => {
          const updated = { ...prev, [sectionKey]: [...(prev[sectionKey] || [null,null,null])] };
          updated[sectionKey][idx] = b64;
          db.ref("guideImages").set(updated);
          return updated;
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removeImage(sectionKey, idx) {
    setGuideImages(prev => {
      const updated = { ...prev, [sectionKey]: [...(prev[sectionKey] || [null,null,null])] };
      updated[sectionKey][idx] = null;

// ── Castle Map ─────────────────────────────────────────────────────────────
//
// Layout matches blueprint exactly:
//   • 13×13 uniform grid of assignable tiles
//   • All tiles gray / light — fully assignable (no "enemy zone" tiles baked in)
//   • Red rectangle border drawn around the inner 11×11 area (rows 1–11, cols 1–11)
//   • Castle = white 6×6 zone in center (rows 3–8, cols 3–8), NOT assignable
//   • 4 turret tiles at castle corners labeled North/East/West/South
//     - North: top-left corner of castle (r=3, c=3)
//     - East:  top-right corner (r=3, c=8)
//     - West:  bottom-left corner (r=8, c=3)
//     - South: bottom-right corner (r=8, c=8)
//   • Castle interior (non-turret cells) rendered as white overlay, no tile grid shown

// 14×14 grid. Layout:
//   Row/Col 0        → outer ring (assignable, outside red border)
//   Row/Col 1        → red border line sits on outer edge of this row/col
//   Rows/Cols 2–3    → 3-tile gap between red border and castle  (wait: border at col1 inner edge, gap cols 2,3,4 = 3 tiles... let's be precise)
//
// Precise layout (0-indexed):
//   Col 0            : outer tile (assignable)
//   Col 1            : red border left edge passes between col0 and col1 outer edges
//   Cols 1,2,3       : 3 gap tiles inside red border on left  → castle starts col 4
//   Cols 4–9         : castle (6 wide)
//   Cols 10,11,12    : 3 gap tiles inside red border on right
//   Col 13           : outer tile (assignable)
//   Red border: left edge at col1 left, right edge at col12 right → spans cols 1–12
//   Same logic for rows.
//
// 14 cols total: 0 | 1,2,3(gap) | 4,5,6,7,8,9(castle) | 10,11,12(gap) | 13
// Red border rect encompasses rows 1–12, cols 1–12

const ROWS = 14, COLS = 14;

// Castle occupies rows 4-9, cols 4-9 (inclusive) — 6×6
const CR1 = 4, CR2 = 9, CC1 = 4, CC2 = 9;

// Maps the turret corner label to its Primary Target name
const TURRET_LABEL_TO_TARGET = {
  "North": "Turret (N)",
  "East":  "Turret (E)",
  "South": "Turret (S)",
  "West":  "Turret (W)",
};

const TURRETS = [
  { r: CR1, c: CC1, label: "North" },
  { r: CR1, c: CC2, label: "East" },
  { r: CR2, c: CC1, label: "West" },
  { r: CR2, c: CC2, label: "South" },
];

function isCastle(r, c) { return r >= CR1 && r <= CR2 && c >= CC1 && c <= CC2; }
function isCastleInterior(r, c) { return r > CR1 && r < CR2 && c > CC1 && c < CC2; }
function isCastleWall(r, c) { return isCastle(r, c) && !isTurret(r, c) && !isCastleInterior(r, c); }
function isTurret(r, c) { return TURRETS.some(t => t.r === r && t.c === c); }
function getTurretLabel(r, c) { return TURRETS.find(t => t.r === r && t.c === c)?.label || null; }

function MemberSummary({ members, alliances, kvkAlliances }) {
  const total = members.length;

  const availGroups = [

    { label: "2nd Half", color: C.gold,   count: members.filter(m => m.available === "2nd Half").length },
    { label: "On/Off",   color: "#ff8040", count: members.filter(m => m.available === "On/Off").length },
    { label: "None",     color: C.textDim, count: members.filter(m => m.available === "None").length },
  ].filter(g => g.count > 0);

  const tcGroups = [
    { label: "TG5", color: "#fb7185", count: members.filter(m => m.tc === "TG5").length },
    { label: "TG4", color: "#34d399", count: members.filter(m => m.tc === "TG4").length },
    { label: "TG3", color: "#fbbf24", count: members.filter(m => m.tc === "TG3").length },
    { label: "TG2", color: "#60a5fa", count: members.filter(m => m.tc === "TG2").length },
    { label: "TG1", color: "#a78bfa", count: members.filter(m => m.tc === "TG1").length },
    { label: "Sub", color: C.textDim,  count: members.filter(m => m.tc && !m.tc.startsWith("TG")).length },
  ].filter(g => g.count > 0);

  const kvkGroups = [
    ...kvkAlliances.map(a => ({ label: a.name, color: _kvkAllianceColorMap[a.name] || C.textDim, count: members.filter(m => m.kvkAlliance === a.name).length })),
    { label: "Unassigned", color: C.textDim, count: members.filter(m => !m.kvkAlliance).length },
  ].filter(g => g.count > 0);

  const leaders = members.filter(m => m.role === "Rally Leader").length;
  const joiners = members.filter(m => m.role === "Rally Joiner").length;
  const confirmed = members.filter(m => m.available !== "None").length;

  const StatGroup = ({ title, items }) => (
    <div style={{ flex: "1 1 0" }}>
      <div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Roboto Condensed',sans-serif", fontWeight: 700 }}>{title}</div>

  return (
    <div style={{ background: "rgba(255,255,255,0.05)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)", border: "1px solid rgba(255,255,255,0.10)", borderRadius: 14, padding: "14px 18px", marginBottom: 16, boxShadow: "0 4px 20px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.07)" }}>
      {/* Top row — headline numbers */}
      <div style={{ display: "flex", gap: 20, marginBottom: 14, paddingBottom: 12, borderBottom: "1px solid rgba(255,255,255,0.07)", flexWrap: "wrap" }}>
        {[
          { label: "Total", value: total, color: C.text },
          { label: "Confirmed", value: confirmed, color: C.green, sub: `${total > 0 ? Math.round(confirmed/total*100) : 0}%` },
          { label: "Leaders", value: leaders, color: C.gold },

        <div style={{ width: 1, background: "rgba(255,255,255,0.07)", flexShrink: 0 }} />

// ── Roster Progress Bars ──────────────────────────────────────────────────
function RosterProgress({ members, kvkAlliances, assignments, mapOnly }) {
  const isFull    = m => m.available === "Full";
  const isActive  = m => m.available === "Full" || m.available === "1st Half";
  const isTG1Plus = m => m.tc && m.tc.startsWith("TG");
  const isTG3     = m => m.tc === "TG3";
  const isWAR     = m => m.kvkAlliance === "MKP";  // MKP = Assault Squad
  const isMKP     = m => m.kvkAlliance === "WFP";  // WFP = Garrison Squad

  const warColor = kvkAlliances.find(a => a.name === "MKP")?.color || "#fbbf24";
  const mkpColor = kvkAlliances.find(a => a.name === "WFP")?.color || "#60a5fa";

  // Map placement — members whose ID appears in a named (non-placeholder) tile
  const assignedIds = new Set(
    Object.values(assignments || {})
      .filter(a => a.type === "friendly" && !a.placeholder && a.member?.id)
      .map(a => a.member.id)
  );
  const warOnMap  = members.filter(m => isWAR(m) && assignedIds.has(m.id)).length;
  const mkpOnMap  = members.filter(m => isMKP(m) && assignedIds.has(m.id)).length;
  const warTotal  = members.filter(m => isWAR(m)).length;
  const mkpTotal  = members.filter(m => isMKP(m)).length;

  const squads = [
    {
      name: "MKP", color: warColor, subtitle: "Assault Squad · 4 Rallies",
      onMap: warOnMap, total: warTotal,
      rows: [
        { label: "Rally Leaders", note: "Full only · TG1+",     have: members.filter(m => isWAR(m) && isFull(m) && m.role === "Rally Leader" && isTG1Plus(m)).length, need: 4 },
        { label: "Rally Joiners", note: "Full/1st Half · TG1+", have: members.filter(m => isWAR(m) && isActive(m) && m.role === "Rally Joiner" && isTG1Plus(m)).length, need: 28 },
        { label: "Turret N & S",  note: "Primary target N or S",have: members.filter(m => isWAR(m) && ["Turret (N)","Turret (S)"].includes(m.primaryTarget)).length, need: 8 },
      ],
    },
    {
      name: "WFP", color: mkpColor, subtitle: "Garrison Squad · 2 Squads",
      onMap: mkpOnMap, total: mkpTotal,
      rows: [
        { label: "Garrison Core", note: "TG3 · Castle target",  have: members.filter(m => isMKP(m) && isTG3(m) && m.primaryTarget === "Castle").length, need: 15 },
        { label: "Turret E & W",  note: "Primary target E or W",have: members.filter(m => isMKP(m) && ["Turret (E)","Turret (W)"].includes(m.primaryTarget)).length, need: 7 },
      ],
    },
  ];

  // Overall readiness %
  const totalHave = squads.reduce((s, sq) => s + sq.rows.reduce((a, r) => a + Math.min(r.have, r.need), 0), 0);
  const totalNeed = squads.reduce((s, sq) => s + sq.rows.reduce((a, r) => a + r.need, 0), 0);
  const readinessPct = Math.round((totalHave / totalNeed) * 100);
  const readyColor = readinessPct >= 90 ? C.green : readinessPct >= 60 ? C.gold : C.red;

  // Warnings
  const warnings = [];
  const warLeadersUnreliable = members.filter(m => isWAR(m) && m.role === "Rally Leader" && !isActive(m));
  if (warLeadersUnreliable.length) warnings.push({ color: C.red,  msg: `${warLeadersUnreliable.length} MKP Rally Leader${warLeadersUnreliable.length > 1 ? "s" : ""} have unreliable availability (${warLeadersUnreliable.map(m => m.name).join(", ")})` });
  const mkpUnconfirmed = members.filter(m => isMKP(m) && isTG3(m) && m.available === "None");
  if (mkpUnconfirmed.length) warnings.push({ color: C.gold, msg: `${mkpUnconfirmed.length} WFP TG3 player${mkpUnconfirmed.length > 1 ? "s" : ""} haven't confirmed availability yet` });
  if (warTotal > 0 && warOnMap < warTotal * 0.5) warnings.push({ color: C.gold, msg: `Only ${warOnMap} of ${warTotal} MKP (Assault) players are placed on the map — drag from UNPOSITIONED to fill tiles` });
  if (mkpTotal > 0 && mkpOnMap < mkpTotal * 0.5) warnings.push({ color: C.gold, msg: `Only ${mkpOnMap} of ${mkpTotal} WFP (Garrison) players are placed on the map` });

  return (
    <div style={{ marginBottom: 14 }}>
      {/* Overall readiness — full view only */}
      {!mapOnly && (
      <div style={{ background: "rgba(255,255,255,0.05)", border: `1px solid ${readyColor}44`, borderRadius: 10, padding: "10px 14px", marginBottom: 10, display: "flex", alignItems: "center", gap: 14 }}>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: C.textDim, textTransform: "uppercase", letterSpacing: 1, fontFamily: "'Roboto Condensed',sans-serif" }}>Overall Readiness</span>
            <span style={{ fontSize: 16, fontWeight: 800, color: readyColor, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1 }}>{readinessPct}%</span>
          </div>
          <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 99, height: 7, overflow: "hidden" }}>
            <div style={{ width: `${readinessPct}%`, height: "100%", background: `linear-gradient(90deg, ${readyColor}aa, ${readyColor})`, borderRadius: 99, transition: "width 0.5s ease", boxShadow: `0 0 10px ${readyColor}66` }} />
          </div>
        </div>
        <div style={{ fontSize: 11, fontWeight: 800, color: readyColor, flexShrink: 0, fontFamily: "'Roboto Condensed',sans-serif" }}>
          {readinessPct >= 90 ? "✓ Battle Ready" : readinessPct >= 60 ? "⚠ Nearly Ready" : "✗ Not Ready"}
        </div>
      </div>
      )}

      {/* Squad cards */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {squads.map(sq => (
          <div key={sq.name} style={{ background: "rgba(255,255,255,0.05)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)", border: `1px solid ${sq.color}44`, borderRadius: 12, padding: "12px 14px", boxShadow: `0 4px 20px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.07)` }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                <span style={{ fontFamily: "'Bebas Neue'", fontSize: 17, color: sq.color, letterSpacing: 1 }}>{sq.name}</span>
                <span style={{ fontSize: 10, color: C.textDim }}>{sq.subtitle}</span>
              </div>
              <span style={{ fontSize: 10, color: sq.color, fontWeight: 700, fontFamily: "'Roboto Condensed',sans-serif" }}>{sq.total} assigned</span>
            </div>

            {/* Role bars — full view only */}
            {!mapOnly && sq.rows.map(row => {
              const pct = Math.min(row.have / row.need, 1);
              const done = row.have >= row.need;
              const col = done ? C.green : sq.color;
              const gap = row.need - row.have;
              return (
                <div key={row.label} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}>
                    <span style={{ fontSize: 10, color: C.text, fontWeight: 600 }}>{row.label}</span>
                    <span style={{ fontSize: 11, fontWeight: 800, color: col, fontFamily: "'Roboto Condensed',sans-serif", flexShrink: 0, marginLeft: 8 }}>{row.have}/{row.need}{done ? " ✓" : ""}</span>
                  </div>
                  <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 99, height: 6, overflow: "hidden", marginBottom: 3 }}>
                    <div style={{ width: `${pct * 100}%`, height: "100%", background: done ? `linear-gradient(90deg, ${C.green}cc, ${C.green})` : `linear-gradient(90deg, ${col}88, ${col})`, borderRadius: 99, boxShadow: done ? `0 0 8px ${C.green}88` : `0 0 6px ${col}44`, transition: "width 0.5s ease" }} />
                  </div>
                  {!done && <div style={{ fontSize: 9, color: C.red, fontStyle: "italic" }}>Need {gap} more · {row.note}</div>}
                </div>
              );
            })}

            {/* Map placement — always shown */}
            <div style={{ borderTop: mapOnly ? "none" : "1px solid rgba(255,255,255,0.07)", paddingTop: mapOnly ? 0 : 8, marginTop: mapOnly ? 0 : 4 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}>
                <span style={{ fontSize: 10, color: C.textDim, fontWeight: 600 }}>Map Placement</span>
                <span style={{ fontSize: 11, fontWeight: 800, fontFamily: "'Roboto Condensed',sans-serif", color: sq.onMap === sq.total && sq.total > 0 ? C.green : sq.color }}>
                  {sq.onMap}/{sq.total} · {sq.total > 0 ? Math.round(sq.onMap / sq.total * 100) : 0}%
                </span>
              </div>
              <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 99, height: 6, overflow: "hidden", marginBottom: 3 }}>
                <div style={{ width: sq.total > 0 ? `${(sq.onMap / sq.total) * 100}%` : "0%", height: "100%", background: sq.onMap === sq.total && sq.total > 0 ? `linear-gradient(90deg, ${C.green}cc, ${C.green})` : `linear-gradient(90deg, ${sq.color}88, ${sq.color})`, borderRadius: 99, transition: "width 0.5s ease" }} />
              </div>
              {sq.onMap < sq.total && sq.total > 0 && (
                <div style={{ fontSize: 9, color: C.textDim, fontStyle: "italic" }}>{sq.total - sq.onMap} tagged but not yet placed on map</div>
              )}
            </div>
          </div>
        ))}
      </div>

      {/* Warnings — full view only */}
      {!mapOnly && warnings.length > 0 && (
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 4 }}>
          {warnings.map((w, i) => (
            <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", background: w.color + "11", border: `1px solid ${w.color}33`, borderRadius: 8, padding: "6px 10px" }}>
              <span style={{ color: w.color, fontSize: 11, flexShrink: 0 }}>⚠</span>
              <span style={{ fontSize: 10, color: C.textDim, lineHeight: 1.5 }}>{w.msg}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CastleMap({ members, assignments, setAssignments, isMobile, viewportWidth, kvkAlliances }) {
  const GAP = isMobile ? 1 : 3;
  const mobileMapWidth = Math.max(252, (viewportWidth || 375) - 44);
  const TILE = isMobile ? Math.max(18, Math.floor((mobileMapWidth - (COLS - 1) * GAP) / COLS)) : 50;
  const [modal, setModal] = useState(null);
  const [hover, setHover] = useState(null);
  const [filter, setFilter] = useState("all");
  const [dragOverTile, setDragOverTile] = useState(null);
  const [unpFilter, setUnpFilter] = useState({});
  const [activePlaceholder, setActivePlaceholder] = useState(null);
  const placeholderMatches = ph => activePlaceholder && Boolean(activePlaceholder.isEnemy) === Boolean(ph.isEnemy) && activePlaceholder.kvkAlliance === ph.kvkAlliance && activePlaceholder.tc === ph.tc;
  const togglePlaceholder = ph => setActivePlaceholder(previous => previous && Boolean(previous.isEnemy) === Boolean(ph.isEnemy) && previous.kvkAlliance === ph.kvkAlliance && previous.tc === ph.tc ? null : ph);

  const key = (r, c) => `${r},${c}`;
  const getA = (r, c) => assignments[key(r, c)];

  function handleClick(r, c) {
    if (isCastle(r, c) && !isTurret(r, c)) return;
    if (isTurret(r, c)) return;
    if (activePlaceholder) { assignPlaceholder(r, c, activePlaceholder); setHover(null); return; }
    if (isMobile) window.scrollTo({ top: 0, behavior: "smooth" });
    setModal({ r, c, existing: getA(r, c) });
  }

  function assignFriendly(r, c, memberId) {
    const member = members.find(m => m.id === memberId);
    if (!member) return;
    setAssignments(p => ({ ...p, [key(r, c)]: { type: "friendly", member } }));
    setModal(null);
  }
  function assignEnemy(r, c, data) {
    setAssignments(p => ({ ...p, [key(r, c)]: { type: "enemy", ...data } }));
    setModal(null);
  }
  function assignPlaceholder(r, c, ph) {
    if (ph.isEnemy) {
      setAssignments(p => ({ ...p, [key(r, c)]: { type: "enemy", placeholder: true, name: "ENM", kingdom: "", threat: "Rally", notes: "" } }));
    } else {
      setAssignments(p => ({ ...p, [key(r, c)]: { type: "friendly", placeholder: true, kvkAlliance: ph.kvkAlliance, tc: ph.tc } }));
    }
    setModal(null);
  }
  function clearTile(r, c) {
    setAssignments(p => { const n = { ...p }; delete n[key(r, c)]; return n; });
    setModal(null);
  }

  const friendlyCount = Object.values(assignments).filter(a => a.type === "friendly").length;
  const enemyCount = Object.values(assignments).filter(a => a.type === "enemy").length;

  const gridW = COLS * TILE + (COLS - 1) * GAP;
  const gridH = ROWS * TILE + (ROWS - 1) * GAP;

  // Castle overlay — covers the full 6×6 zone (rows CR1–CR2, cols CC1–CC2)
  // Turrets sit on top at zIndex 25; this fills everything else
  const interiorX = CC1 * (TILE + GAP);
  const interiorY = CR1 * (TILE + GAP);
  const interiorW = 6 * TILE + 5 * GAP;
  const interiorH = 6 * TILE + 5 * GAP;

  // Red border: encompasses rows 1–12, cols 1–12 (3 gap tiles each side around 6×6 castle)
  const bx = 1 * (TILE + GAP) - 1;
  const by = 1 * (TILE + GAP) - 1;
  const bw = 12 * TILE + 11 * GAP + 2;
  const bh = 12 * TILE + 11 * GAP + 2;

  // Gold castle outline: rows CR1–CR2, cols CC1–CC2
  const cx = CC1 * (TILE + GAP) - 1;
  const cy = CR1 * (TILE + GAP) - 1;
  const cw = 6 * TILE + 5 * GAP + 2;
  const ch = 6 * TILE + 5 * GAP + 2;

  // ── Sidebar derived data ──────────────────────────────────────────────────
  const friendlyByAlliance = {};
  Object.values(assignments).filter(a => a.type === "friendly").forEach(a => {
    const al = a.member?.alliance;
    friendlyByAlliance[al] = (friendlyByAlliance[al] || 0) + 1;
  });
  const targetCounts = {};
  members.forEach(m => { targetCounts[m.primaryTarget] = (targetCounts[m.primaryTarget] || 0) + 1; });
  const assignedMemberIds = new Set(Object.values(assignments).filter(a => a.type === "friendly" && !a.placeholder && a.member).map(a => a.member.id));
  const unassignedMembers = members.filter(m => !assignedMemberIds.has(m.id)).sort((a, b) => a.name.localeCompare(b.name));
  const availColorMap = { Full: C.green, "1st Half": C.blue, "2nd Half": C.gold, "On/Off": C.red };
  const targetColorMap = { Castle: C.accent, "Turret (N)": "#20d0d0", "Turret (E)": "#c060ff", "Turret (S)": "#ff8040", "Turret (W)": "#40c080" };



  return (
    <div style={{ display: "flex", flexDirection: isMobile ? "column" : "row", gap: 16, alignItems: "flex-start" }}>

      {/* ── LEFT: Map ── */}
      <div style={{ flex: "0 0 auto", width: isMobile ? "100%" : "auto", overflowX: isMobile ? "auto" : "visible" }}>
        {/* Filters */}
        <div style={{ display: "flex", gap: 5, marginBottom: 10, alignItems: "center", flexWrap: "wrap" }}>
          {[["all","All"],["friendly","🤝 Friendly"],["enemy","⚔ Enemy"],["unassigned","○ Unassigned"]].map(([v, label]) => (
            <button key={v} onClick={() => setFilter(v)} style={{
              ...btnSt, fontSize: 11, padding: "5px 12px",
              background: filter === v ? "rgba(167,139,250,0.2)" : "rgba(255,255,255,0.05)",
              color: filter === v ? C.accent : C.textDim,
              border: filter === v ? `1px solid ${C.accent}66` : "1px solid rgba(255,255,255,0.08)",
              borderRadius: 20,
            }}>{label}</button>
          ))}
          {kvkAlliances.map(a => (
            <button key={a.name} onClick={() => setFilter(`kvk:${a.name}`)} style={{
              ...btnSt, fontSize: 11, padding: "5px 12px", fontWeight: 800,
              background: filter === `kvk:${a.name}` ? `${a.color}33` : "rgba(255,255,255,0.05)",
              color: filter === `kvk:${a.name}` ? a.color : C.textDim,
              border: filter === `kvk:${a.name}` ? `1px solid ${a.color}77` : "1px solid rgba(255,255,255,0.08)",
              borderRadius: 20,
            }}>{a.name}</button>
          ))}
          <div style={{ flex: 1 }} />
          <button onClick={() => setAssignments({})} style={{ ...btnSt, fontSize: 11, padding: "5px 12px", background: "rgba(248,113,113,0.15)", color: C.red, border: `1px solid ${C.red}44`, borderRadius: 20 }}>↺ Reset</button>
        </div>

        {/* Grid */}
        <div style={{ position: "relative", width: gridW, height: gridH, flexShrink: 0 }}>
          {Array.from({ length: ROWS }, (_, r) =>
            Array.from({ length: COLS }, (_, c) => {
              const castle = isCastle(r, c);
              const turret = isTurret(r, c);
              const wall = !turret && isCastleWall(r, c);
              const assignment = getA(r, c);
              const x = c * (TILE + GAP);
              const y = r * (TILE + GAP);
              const tLabel = getTurretLabel(r, c);
              const isSelected = modal?.r === r && modal?.c === c;
              // Skip interior AND wall tiles (only turrets render individually)
              if (castle && !turret) return null;
              let dimmed = false;
              if (filter === "friendly" && assignment?.type !== "friendly") dimmed = true;
              if (filter === "enemy" && assignment?.type !== "enemy") dimmed = true;
              if (filter === "unassigned" && assignment) dimmed = true;
              if (filter.startsWith("kvk:")) {
                const kvkName = filter.slice(4);
                if (!assignment || assignment.type !== "friendly" || assignment.member?.kvkAlliance !== kvkName) dimmed = true;
              }
              let bg, border;
              const isLeader = assignment?.type === "friendly" && !assignment.placeholder && assignment.member?.role === "Rally Leader";
              const isPlaceholder = assignment?.placeholder === true;
              const leaderTarget = isLeader && !isPlaceholder ? (assignment.member?.primaryTarget || "Castle") : null;
              const leaderStyle = leaderTarget ? (LEADER_STYLES[leaderTarget] || LEADER_STYLES["Castle"]) : null;
              // KvK alliance color — named tiles use member field, placeholders use direct field
              const kvkCol = assignment?.type === "friendly"
                ? (isPlaceholder
                    ? (_kvkAllianceColorMap[assignment.kvkAlliance] || null)
                    : (_kvkAllianceColorMap[assignment.member?.kvkAlliance] || null))
                : null;
              if (dimmed) { bg = "rgba(255,255,255,0.03)"; border = "1px solid rgba(255,255,255,0.05)"; }
              else if (turret) {
                const ts = LEADER_STYLES[TURRET_LABEL_TO_TARGET[tLabel]] || LEADER_STYLES["Castle"];
                bg = ts.bg; border = `1.5px solid ${ts.border}`;
              }
              else if (assignment?.type === "friendly" && isPlaceholder) {
                const phCol = kvkCol || "#6b7280";
                bg = `linear-gradient(135deg, ${phCol}14, ${phCol}22)`;
                border = `1.5px dashed ${phCol}99`;
              }
              else if (isLeader) {
                bg = leaderStyle.bg;
                border = kvkCol ? `2px solid ${kvkCol}` : `1.5px solid ${leaderStyle.border}`;
              }
              else if (assignment?.type === "friendly") {
                if (kvkCol) { bg = `linear-gradient(135deg, ${kvkCol}22, ${kvkCol}3a)`; border = `1.5px solid ${kvkCol}99`; }
                else { bg = "linear-gradient(135deg,#0d2e52,#0a3d6e)"; border = `1.5px solid ${C.blue}`; }
              }
              else if (assignment?.type === "enemy") { bg = "linear-gradient(135deg,#3a0d0d,#520a0a)"; border = `1.5px solid ${C.red}`; }
              else { bg = "rgba(180,192,205,0.55)"; border = "1px solid rgba(160,175,190,0.5)"; }
              if (isSelected) border = `2px solid ${C.accent}`;
              if (dragOverTile === key(r, c) && !castle && !dimmed) border = `2.5px dashed ${C.accent}`;
              return (
                <div key={`${r},${c}`}
                  onClick={() => !turret && handleClick(r, c)}
                  onMouseEnter={e => {
                    if (assignment && !turret) setHover({ r, c, a: assignment, x: e.clientX, y: e.clientY });
                    if (!turret && !dimmed && !isSelected) { e.currentTarget.style.filter = "brightness(1.15)"; e.currentTarget.style.boxShadow = `0 0 0 1.5px ${C.accent}88`; }
                  }}
                  onMouseLeave={e => {
                    setHover(null);
                    e.currentTarget.style.filter = ""; e.currentTarget.style.boxShadow = "";
                  }}
                  onDragOver={e => {
                    if (castle || dimmed) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "move";
                    setDragOverTile(key(r, c));
                  }}
                  onDragLeave={() => setDragOverTile(null)}
                  onDrop={e => {
                    e.preventDefault();
                    setDragOverTile(null);
                    if (castle || dimmed) return;
                    const memberId = parseInt(e.dataTransfer.getData("memberId"));
                    const phStr = e.dataTransfer.getData("placeholder");
                    if (memberId) assignFriendly(r, c, memberId);
                    else if (phStr) assignPlaceholder(r, c, JSON.parse(phStr));
                  }}
                  style={{
                    position: "absolute", left: x, top: y, width: TILE, height: TILE,
                    background: bg, border, borderRadius: 4,
                    cursor: turret ? "default" : "pointer",
                    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                    overflow: "hidden", boxSizing: "border-box", zIndex: turret ? 25 : 1,
                    transition: "filter 0.1s, box-shadow 0.1s",
                  }}>
                  {turret && (() => {
                    const ts = LEADER_STYLES[TURRET_LABEL_TO_TARGET[tLabel]] || LEADER_STYLES["Castle"];
                    return <span style={{ fontSize: 9, fontWeight: 800, color: ts.border, textAlign: "center", lineHeight: 1.2, fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.5, textTransform: "uppercase", textShadow: `0 0 6px ${ts.border}88` }}>{tLabel}</span>;
                  })()}
                  {!turret && !dimmed && assignment?.type === "friendly" && isPlaceholder && (() => {
                    const phCol = kvkCol || "#9ca3af";
                    return (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "2px" }}>
                        <span style={{ fontSize: isMobile ? 7 : 9, fontWeight: 700, color: phCol, fontFamily: "'Roboto Condensed',sans-serif", lineHeight: 1, textAlign: "center" }}>{assignment.tc}</span>
                        <span style={{ fontSize: isMobile ? 6 : 8, fontWeight: 600, color: phCol + "cc", fontFamily: "'Roboto Condensed',sans-serif", lineHeight: 1 }}>{assignment.kvkAlliance}</span>
                      </div>
                    );
                  })()}
                  {!turret && !dimmed && assignment?.type === "friendly" && !isPlaceholder && assignment.member && (() => {
                    // Always use live member data so avatarUrl and other updates show immediately
                    const m = members.find(mbr => mbr.id === assignment.member.id) || assignment.member;
                    const target = m.primaryTarget || "";
                    const targetCol = TARGET_COLORS[target] || C.textDim;
                    const iconSize = isMobile ? 8 : 13;
                    const turretSize = isMobile ? 9 : 15;
                    const targetIconFn = target === "Castle"
                      ? (col) => <CrownIcon color={col} size={iconSize} />
                      : target.startsWith("Turret")
                        ? (col) => <TurretIcon color={col} letter={target.slice(8,9)} size={turretSize} />
                        : null;

                    // Avatar image mode
                    if (m.avatarUrl) {
                      return (
                        <div style={{ position: "relative", width: TILE - 2, height: TILE - 2 }}>
                          <img src={m.avatarUrl} alt={m.name}
                            style={{ width: "100%", height: "100%", objectFit: "cover", borderRadius: 3, display: "block" }}
                            onError={e => { e.target.style.display = "none"; }}
                          />
                          {isLeader && targetIconFn && (
                            <div style={{ position: "absolute", bottom: 13, right: 1, filter: `drop-shadow(0 0 3px rgba(0,0,0,0.8))`, lineHeight: 0 }}>
                              {targetIconFn(targetCol)}
                            </div>
                          )}
                          {/* Name bar — always readable via stroke-style text shadow */}
                          <div style={{
                            position: "absolute", bottom: 0, left: 0, right: 0,
                            background: "linear-gradient(transparent, rgba(0,0,0,0.72))",
                            borderRadius: "0 0 3px 3px",
                            padding: "4px 2px 2px",
                            fontSize: isMobile ? 6 : 8,
                            fontWeight: 800,
                            color: "#fff",
                            fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif",
                            textAlign: "center",
                            lineHeight: 1.1,
                            letterSpacing: 0.2,
                            overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis",
                            textShadow: "0 0 3px #000, 0 1px 2px #000, -1px 0 2px #000, 1px 0 2px #000",
                          }}>{m.name.slice(0, 10)}</div>
                        </div>
                      );
                    }

                    // Name pill fallback (no avatar)
                    const full = m.name;
                    const display = full.length > 10 ? full.slice(0, 10) + "…" : full;
                    const len = display.length;
                    const fs = isMobile ? (len <= 5 ? 8 : 7) : (len <= 4 ? 12 : len <= 6 ? 11 : len <= 8 ? 10 : 9);
                    const ls = isLeader ? (LEADER_STYLES[target] || LEADER_STYLES["Castle"]) : null;
                    const pillBg = isLeader ? ls.pill : (kvkCol ? `${kvkCol}dd` : "rgba(160,210,255,0.95)");
                    const pillText = isLeader ? ls.text : (kvkCol ? "#050505" : "#071830");
                    return (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, width: "100%", padding: "2px 2px" }}>
                        <span style={{
                          fontSize: fs, fontWeight: 700, lineHeight: 1, color: pillText,
                          background: pillBg, borderRadius: 3, padding: "2px 3px",
                          fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0,
                          maxWidth: TILE - 2, overflow: "hidden", whiteSpace: "nowrap",
                          display: "block", textAlign: "center", boxShadow: "0 1px 3px rgba(0,0,0,0.25)",
                        }}>{display}</span>
                        {isLeader && targetIconFn && (
                          <div style={{ filter: `drop-shadow(0 0 2px ${targetCol}99)`, lineHeight: 0 }}>
                            {targetIconFn(targetCol)}
                          </div>
                        )}
                      </div>
                    );
                  })()}
                  {!turret && !dimmed && assignment?.type === "enemy" && null}
                </div>
              );
            })
          )}

          {/* Castle interior — fills full 6×6 zone; turrets (zIndex 25) sit on top */}
          <div style={{
            position: "absolute", left: interiorX, top: interiorY, width: interiorW, height: interiorH,
            background: LEADER_STYLES["Castle"].bg,
            display: "flex", alignItems: "center", justifyContent: "center",
            zIndex: 10, pointerEvents: "none",
            boxShadow: `inset 0 0 24px rgba(0,0,0,0.4), 0 0 12px ${LEADER_STYLES["Castle"].border}44`,
          }}>
            <span style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: isMobile ? 16 : 28, fontWeight: 900, color: LEADER_STYLES["Castle"].border, letterSpacing: 4, textShadow: `0 0 16px ${LEADER_STYLES["Castle"].border}88` }}>CASTLE</span>
          </div>

          {/* SVG borders */}
          <svg style={{ position: "absolute", left: 0, top: 0, width: gridW, height: gridH, pointerEvents: "none", zIndex: 30 }}>
            <defs>
              <filter id="castleGlow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            {/* Castle zone border — thick gold with glow */}
            <rect x={cx} y={cy} width={cw} height={ch} fill="none"
              stroke={LEADER_STYLES["Castle"].border} strokeWidth={3}
              filter="url(#castleGlow)" />
            {/* Battlefield red border */}
            <rect x={bx} y={by} width={bw} height={bh} fill="none" stroke={C.red} strokeWidth={2} rx={1} />
          </svg>
        </div>

        {/* Legend */}
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
          {[
            { bg: "rgba(180,192,205,0.55)", border: "rgba(160,175,190,0.5)", label: "Empty" },
            ...Object.entries(LEADER_STYLES).filter(([k]) => k !== "None").map(([k, s]) => ({
              bg: s.bg, border: s.border,
              label: k === "Castle" ? "Leader·🏰" : `Leader·${k.slice(8,9)}`
            })),
            { bg: "linear-gradient(135deg,#0d2e52,#0a3d6e)", border: C.blue, label: "Joiner" },
            ...kvkAlliances.map(a => ({ bg: `linear-gradient(135deg, ${a.color}22, ${a.color}3a)`, border: `${a.color}99`, label: a.name })),
            { bg: "linear-gradient(135deg,#3a0d0d,#520a0a)", border: C.red,    label: "Enemy" },
          ].map(({ bg, border, label }) => (
            <div key={label} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, color: C.textDim }}>
              <div style={{ width: 11, height: 11, background: bg, border: `1.5px solid ${border}`, borderRadius: 3, flexShrink: 0 }} />
              {label}
            </div>
          ))}
        </div>
      </div>

      {/* ── RIGHT: Sidebar ── */}
      <div style={{ flex: 1, minWidth: isMobile ? "100%" : 200, display: "flex", flexDirection: "column", gap: 8, maxHeight: isMobile ? "none" : gridH + 50, overflowY: isMobile ? "visible" : "auto" }}>

        {/* Tile assignment panel — shown when a tile is selected */}
        {modal && (
          <TilePanel modal={modal} members={members} assignments={assignments}
            onFriendly={assignFriendly} onEnemy={assignEnemy} onClear={clearTile} onClose={() => setModal(null)} isMobile={isMobile} />
        )}

        {/* Placeholder chips */}
        {!isMobile && (
          <SideSection title="PLACEHOLDERS">
            <div style={{ fontSize: 9, color: C.textDim, marginBottom: 8, fontStyle: "italic" }}>Drag onto a tile to reserve a slot</div>

            <div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 5 }}>Friendly</div>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 10 }}>
              {kvkAlliances.map(a =>
                ["TG5", "TG4+", "TG3+"].map(tc => {
                  const col = _kvkAllianceColorMap[a.name] || C.textDim;
                  return (
                    <div key={`${a.name}-${tc}`}
                      role="button" tabIndex={0} aria-pressed={Boolean(placeholderMatches({ kvkAlliance: a.name, tc }))}
                      onClick={() => togglePlaceholder({ kvkAlliance: a.name, tc })}
                      onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); togglePlaceholder({ kvkAlliance: a.name, tc }); } }}
                      draggable
                      onDragStart={e => {
                        e.dataTransfer.setData("placeholder", JSON.stringify({ kvkAlliance: a.name, tc }));
                        e.currentTarget.style.opacity = "0.5";
                      }}
                      onDragEnd={e => { e.currentTarget.style.opacity = "1"; }}
                      style={{
                        background: col + (placeholderMatches({ kvkAlliance: a.name, tc }) ? "44" : "18"), border: placeholderMatches({ kvkAlliance: a.name, tc }) ? `2px solid ${col}` : `1.5px dashed ${col}66`,
                        boxShadow: placeholderMatches({ kvkAlliance: a.name, tc }) ? `0 0 9px ${col}55` : "none",
                        borderRadius: 6, padding: "4px 8px",
                        fontSize: 10, fontWeight: 700, color: col,
                        cursor: "grab", userSelect: "none", lineHeight: 1.4,
                      }}>
                      {tc} {a.name}
                    </div>
                  );
                })
              ).flat()}
            </div>

            <div style={{ fontSize: 9, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 5 }}>Enemy</div>
            <div
              role="button" tabIndex={0} aria-pressed={Boolean(activePlaceholder?.isEnemy)}
              onClick={() => togglePlaceholder({ isEnemy: true })}
              onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); togglePlaceholder({ isEnemy: true }); } }}
              draggable
              onDragStart={e => {
                e.dataTransfer.setData("placeholder", JSON.stringify({ isEnemy: true }));
                e.currentTarget.style.opacity = "0.5";
              }}
              onDragEnd={e => { e.currentTarget.style.opacity = "1"; }}
              style={{
                background: activePlaceholder?.isEnemy ? `${C.red}44` : C.redDim, border: activePlaceholder?.isEnemy ? `2px solid ${C.red}` : `1.5px dashed ${C.red}77`,
                boxShadow: activePlaceholder?.isEnemy ? `0 0 9px ${C.red}55` : "none",
                borderRadius: 6, padding: "4px 10px", display: "inline-block",
                fontSize: 10, fontWeight: 700, color: C.red,
                cursor: "grab", userSelect: "none",
              }}>
              Enemy
            </div>
            <div style={{ fontSize: 10, color: activePlaceholder ? C.accent : C.textDim, marginTop: 10, lineHeight: 1.5 }}>
              {activePlaceholder ? `Selected: ${activePlaceholder.isEnemy ? "Enemy" : `${activePlaceholder.tc} ${activePlaceholder.kvkAlliance}`}. Click tiles to place. Click the placeholder again to unselect.` : "Select a placeholder, then click tiles to place it. You can also drag it onto a tile."}
            </div>
          </SideSection>
        )}

        {/* Unpositioned members — desktop only */}
        {!isMobile && (
          <SideSection title={`UNPOSITIONED (${unassignedMembers.length})`}>
            {unassignedMembers.length === 0 ? (
              <div style={{ fontSize: 10, color: C.green, textAlign: "center", padding: "6px 0" }}>✓ All members positioned</div>
            ) : (
              <>
                {/* Filter bar */}
                <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>
                  {[
                    ["kvkAlliance", "KvK Alliance"], ["available", "Availability"], ["role", "Role"], ["tc", "TC Level"], ["primaryTarget", "Primary Target"],
                  ].map(([field, label]) => (
                    <div key={field} style={{ flex: "1 1 110px", minWidth: 0 }}>
                      <MemberColumnFilter showLabel field={field} label={label} members={unassignedMembers} selected={unpFilter[field]} onChange={values => setUnpFilter(previous => ({ ...previous, [field]: values }))} />
                    </div>
                  ))}
                  {Object.values(unpFilter).some(values => values !== null) && (
                    <button title="Reset filters" aria-label="Reset unpositioned filters" onClick={() => setUnpFilter({})}
                      style={{ ...btnSt, fontSize: 9, padding: "3px 8px", color: C.red, background: C.redDim, border: "none" }}>✕</button>
                  )}
                </div>
                <div style={{ fontSize: 9, color: C.textDim, marginBottom: 6, fontStyle: "italic" }}>Drag a player onto any tile to assign them</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {unassignedMembers.filter(m =>
                    Object.entries(unpFilter).every(([field, values]) => values === null || values.includes(memberFilterValue(m[field])))
                  ).map(m => (
                    <div key={m.id}
                      draggable={true}
                      onDragStart={e => {
                        e.dataTransfer.setData("memberId", String(m.id));
                        e.dataTransfer.effectAllowed = "move";
                        e.currentTarget.style.opacity = "0.5";
                      }}
                      onDragEnd={e => {
                        e.currentTarget.style.opacity = "1";
                        setDragOverTile(null);
                      }}
                      style={{
                        background: "rgba(255,255,255,0.04)", borderRadius: 8, padding: "7px 10px",
                        border: "1px solid rgba(255,255,255,0.07)", display: "flex", flexDirection: "column", gap: 4,
                        cursor: "grab", userSelect: "none",
                      }}>
                      {/* Row 1: dot + name + TC + drag handle */}
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <div style={{ width: 6, height: 6, borderRadius: "50%", background: availColorMap[m.available] || C.textDim, flexShrink: 0, boxShadow: `0 0 4px ${availColorMap[m.available] || C.textDim}` }} />
                        <span style={{ fontSize: 11, fontWeight: 700, color: C.text, flex: 1 }}>{m.name}</span>
                        <span style={{ fontSize: 10, color: C.accent, fontWeight: 700 }}>{m.tc}</span>
                        <span style={{ fontSize: 12, color: C.textDim, lineHeight: 1 }}>⠿</span>
                      </div>
                      {/* Row 2: tags */}
                      <div style={{ display: "flex", gap: 4, flexWrap: "wrap", paddingLeft: 12 }}>
                        {/* Availability */}
                        <span style={{
                          fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 4, lineHeight: 1.5,
                          color: availColorMap[m.available] || C.textDim,
                          background: (availColorMap[m.available] || C.textDim) + "22",
                          border: `1px solid ${(availColorMap[m.available] || C.textDim)}44`,
                        }}>{m.available || "—"}</span>
                        {/* Role */}
                        <span style={{
                          fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 4, lineHeight: 1.5,
                          color: roleColor(m.role), background: roleColor(m.role) + "22",
                          border: `1px solid ${roleColor(m.role)}44`,
                        }}>{m.role === "Rally Leader" ? "Leader" : "Joiner"}</span>
                        {/* KvK Alliance */}
                        {m.kvkAlliance && (
                          <span style={{
                            fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 4, lineHeight: 1.5,
                            color: kvkAllianceColor(m.kvkAlliance),
                            background: kvkAllianceColor(m.kvkAlliance) + "22",
                            border: `1px solid ${kvkAllianceColor(m.kvkAlliance)}55`,
                          }}>{m.kvkAlliance}</span>
                        )}
                        {/* Alliance */}
                        {m.alliance && (
                          <span style={{
                            fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 4, lineHeight: 1.5,
                            color: allianceColor(m.alliance), background: allianceColor(m.alliance) + "18",
                            border: `1px solid ${allianceColor(m.alliance)}33`,
                          }}>{m.alliance}</span>
                        )}
                        {/* Primary Target */}
                        {m.primaryTarget && m.primaryTarget !== "None" && (() => {
                          const tc = { Castle: C.accent, "Turret (N)": "#20d0d0", "Turret (E)": "#c084fc", "Turret (S)": "#ff8040", "Turret (W)": "#40c080" }[m.primaryTarget] || C.textDim;
                          return (
                            <span style={{
                              fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 4, lineHeight: 1.5,
                              color: tc, background: tc + "18", border: `1px solid ${tc}33`,
                            }}>{m.primaryTarget}</span>
                          );
                        })()}
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </SideSection>
        )}

        {/* Full member roster — desktop only (on mobile it clutters below the map) */}
        {!isMobile && (
        <SideSection title="MEMBER ROSTER">
          <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
            {members.map(m => {
              const isOnMap = assignedMemberIds.has(m.id);
              return (
                <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 8px", borderRadius: 6, background: isOnMap ? "rgba(96,165,250,0.12)" : "rgba(255,255,255,0.03)", border: `1px solid ${isOnMap ? C.blue + "44" : "rgba(255,255,255,0.06)"}`, transition: "all 0.15s" }}>
                  <div style={{ width: 5, height: 5, borderRadius: "50%", background: availColorMap[m.available] || C.textDim, flexShrink: 0 }} />
                  <span style={{ fontSize: 10, fontWeight: 700, color: isOnMap ? "#90c8ff" : C.text, flex: 1 }}>{m.name}</span>
                  <span style={{ fontSize: 9, color: C.textDim }}>{m.tc}</span>
                  <span style={{ fontSize: 9, color: allianceColor(m.alliance), fontWeight: 700 }}>{m.alliance}</span>
                  {isOnMap && <span style={{ fontSize: 8, color: C.blue }}>●</span>}
                </div>
              );
            })}
          </div>
        </SideSection>
        )}
      </div>

      {/* Hover tooltip */}
      {hover && (
        <div style={{
          position: "fixed", top: hover.y - 8, left: hover.x + 14,
          background: "#0d1520f2", border: `1px solid ${C.panelBorder}`,
          borderRadius: 7, padding: "10px 14px", zIndex: 9999, fontSize: 12, color: C.text,
          maxWidth: 220, pointerEvents: "none", boxShadow: "0 4px 20px #000a",
        }}>
          {hover.a.type === "friendly" ? (
            <>
              {hover.a.placeholder ? (
                <>
                  <div style={{ fontWeight: 800, color: _kvkAllianceColorMap[hover.a.kvkAlliance] || C.textDim, marginBottom: 5 }}>
                    {hover.a.tc} — {hover.a.kvkAlliance || "Unassigned"}
                  </div>
                  <div style={{ color: C.textDim, fontSize: 11, fontStyle: "italic" }}>Placeholder slot</div>
                </>
              ) : (
                <>
                  <div style={{ fontWeight: 800, color: hover.a.member?.role === "Rally Leader" ? C.gold : C.blue, marginBottom: 5 }}>{hover.a.member?.name || "—"}</div>
                  <div style={{ color: C.textDim, marginBottom: 2 }}>Role: <span style={{ color: C.text }}>{hover.a.member?.role || "—"}</span></div>
                  <div style={{ color: C.textDim }}>Alliance: <span style={{ color: allianceColor(hover.a.member?.alliance) }}>{hover.a.member?.alliance || "—"}</span></div>
                </>
              )}
            </>
          ) : (
            <>
              <div style={{ fontWeight: 800, color: C.red, marginBottom: 5 }}>{hover.a.name || "Enemy"}</div>
              {hover.a.kingdom && <div style={{ color: C.textDim, marginBottom: 2 }}>Kingdom: <span style={{ color: C.text }}>{hover.a.kingdom}</span></div>}

}

function LanguageSelector({ isMobile }) {
  const languages = [
    { code: "en",    label: "English",  short: "EN" },
    { code: "ko",    label: "한국어",    short: "KO" },
    { code: "ar",    label: "العربية",  short: "AR" },
    { code: "es",    label: "Español",  short: "ES" },
    { code: "de",    label: "Deutsch",  short: "DE" },
    { code: "zh-CN", label: "中文",     short: "ZH" },
  ];

  function readLanguageCookie() {
    const match = document.cookie.match(/(?:^|;\s*)googtrans=\/en\/([^;]+)/);
    return match?.[1] || "en";
  }

  const [language, setLanguage] = useState(readLanguageCookie);

  useEffect(() => {
    window.googleTranslateElementInit = () => {
      if (window.google?.translate?.TranslateElement) {
        new window.google.translate.TranslateElement({
          pageLanguage: "en",
          includedLanguages: "en,ko,ar,es,de,zh-CN",
          autoDisplay: false,
        }, "google_translate_element");
      }
    };
    if (window.google?.translate?.TranslateElement) { window.googleTranslateElementInit(); return; }
    if (!document.getElementById("google-translate-script")) {
      const script = document.createElement("script");
      script.id = "google-translate-script";
      script.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      script.async = true;
      document.body.appendChild(script);
    }
  }, []);

  function setTranslationCookie(code) {
    const hostname = window.location.hostname;
    const expires = code === "en" ? "Thu, 01 Jan 1970 00:00:00 GMT" : "Fri, 31 Dec 9999 23:59:59 GMT";
    const value = code === "en" ? "" : `/en/${code}`;
    document.cookie = `googtrans=${value}; path=/; expires=${expires}; SameSite=Lax`;
    if (hostname && hostname !== "localhost") {
      document.cookie = `googtrans=${value}; path=/; domain=.${hostname}; expires=${expires}; SameSite=Lax`;
    }
  }

  function changeLanguage(code) {
    setLanguage(code);
    setTranslationCookie(code);
    window.location.reload();
  }

  return (
    <>
      <div id="google_translate_element" style={{ display: "none" }} />
      <div style={{
        ...glassDeep({ display: "flex", alignItems: "center", gap: 6, padding: isMobile ? "4px 6px" : "5px 8px", borderRadius: 9, flexShrink: 0 }),
      }}>
        {!isMobile && (
          <span style={{ fontSize: 10, color: C.textDim, fontWeight: 700, whiteSpace: "nowrap", fontFamily: "'Roboto Condensed','Arial Narrow',sans-serif", letterSpacing: 0.4 }}>
            LANGUAGE
          </span>
        )}
        <select aria-label="Language" value={language} onChange={e => changeLanguage(e.target.value)}
          style={{ ...inputSt, width: isMobile ? 58 : 104, minWidth: 0, padding: isMobile ? "4px 5px" : "4px 24px 4px 7px", border: "none", background: "rgba(255,255,255,0.05)", fontSize: isMobile ? 11 : 12, fontWeight: 700, cursor: "pointer" }}>
          {languages.map(item => (
            <option key={item.code} value={item.code}>{isMobile ? item.short : item.label}</option>
          ))}
        </select>
      </div>
    </>
  );
}

  // Maps API town_hall_level to dashboard TC format
  // Based on confirmed mapping: 35-39=TG1, 40-44=TG2, 45-49=TG3, 50-54=TG4, 55-59=TG5, etc.
  function mapTcLevel(raw) {
    if (!raw && raw !== 0) return "";
    // Handle existing string TG values
    const s = String(raw).trim().toUpperCase();
    if (s.startsWith("TG") && TC_LEVELS.includes(s)) return s;
    const n = parseInt(raw);
    if (isNaN(n) || n <= 0) return "";
    if (n <= 27) return "";
    if (n === 28) return "28";
    if (n === 29) return "29";
    if (n <= 34) return "30";   // 30-34 → capped at "30" (pre-TG)
    if (n <= 39) return "TG1";
    if (n <= 44) return "TG2";
    if (n <= 49) return "TG3";
    if (n <= 54) return "TG4";
    if (n <= 59) return "TG5";
    if (n <= 64) return "TG6";
    if (n <= 69) return "TG7";
    return "TG8";
  }

  async function syncFromAPI() {
    if (!requireEdit()) return;
    setSyncing(true);
    setSyncMsg(null);

    const API_TOKEN = "jp_f05159a41aae673e635088bb9531ce84db663a0e";
    const KINGDOM   = 1884;
    const ALLIANCES = [
      { id: "189300023", abbr: "MKP" },
      { id: "189300026", abbr: "WFP" },
      { id: "189300024", abbr: "WHL" },
      { id: "189300081", abbr: "OUT" },

    ];

    const delay = ms => new Promise(res => setTimeout(res, ms));
    const headers = { Authorization: `Bearer ${API_TOKEN}` };

    const updates = {};
    let added = 0, updated = 0;
    const perAlliance = [];

    for (const { id, abbr } of ALLIANCES) {
      try {
        if (perAlliance.length > 0) await delay(700);

        const r = await fetch(
          `https://jeabslist.com/api/v1/alliances/${id}?kid=${KINGDOM}`,
          { headers }
        );

        if (!r.ok) {
          perAlliance.push(`${abbr}: HTTP ${r.status}`);
          continue;
        }

        const raw = await r.json();
        // The alliance endpoint returns { id, abbr, name, members: [...] }
        const players = Array.isArray(raw?.members) ? raw.members : [];
        const allianceAbbr = raw?.abbr || abbr;

        if (players.length === 0) {
          perAlliance.push(`${abbr}: 0 members returned`);
          continue;
        }

        let allianceAdded = 0, allianceUpdated = 0;
        for (const p of players) {
          if (!p.id && !p.name) continue;
          const name = (p.name || "").trim();
          if (!name) continue;
          const tc = mapTcLevel(p.town_hall_level ?? p.th_level ?? "");

          const existing = members.find(m => m.name.toLowerCase() === name.toLowerCase());
          if (existing) {
            updates[`members/${existing.id}`] = { ...existing, name, tc, alliance: allianceAbbr, avatarUrl: p.avatar_url || existing.avatarUrl || "", governorId: p.id || existing.governorId || "" };
            allianceUpdated++; updated++;
          } else {
            const newId = Date.now() + Math.floor(Math.random() * 9999) + added;
            updates[`members/${newId}`] = {
              id: newId, name, tc, alliance: allianceAbbr,
              avatarUrl: p.avatar_url || "",
              governorId: p.id || "",
              available: "", role: "", kvkAlliance: "", team: "",
              primaryTarget: "Castle", notes: "",
            };
            allianceAdded++; added++;
          }
        }
        perAlliance.push(`${abbr}: +${allianceAdded} new, ${allianceUpdated} updated`);

      } catch (err) {
        perAlliance.push(`${abbr}: ${err.message}`);
      }
    }

    if (Object.keys(updates).length) await db.ref().update(updates);

    setSyncMsg({
      text: `✓ Total: +${added} new, ${updated} updated  |  ${perAlliance.join("  ·  ")}`,
      ok: added + updated > 0,
    });
    setSyncing(false);
    setTimeout(() => setSyncMsg(null), 15000);
  }

  async function loadPowerSnapshot() {
    if (!requireEdit() || powerSyncing) return;
    setPowerSyncing(true);
    try {
      const updates = {};
      let matched = 0;
      for (const field of MEMBER_POWER_FIELDS) {
        const board = MEMBER_POWER_SNAPSHOT.boards[field];
        const scores = new Map(board.rows.map(row => [String(row.governor_id), row.score]));
        for (const m of members) {
          const id = m.governorId || (/^\d{7,10}$/.test(String(m.id)) ? m.id : null);
          if (!id) continue;
          const score = scores.get(String(id));
          updates[`members/${m.id}/${field}`] = score === undefined ? null : score;
          updates[`members/${m.id}/powerSource`] = "Mightpulse snapshot";
          updates[`members/${m.id}/powerUpdatedAt`] = MEMBER_POWER_SNAPSHOT.fetched_at;
          if (score !== undefined) matched++;
        }
      }
      if (Object.keys(updates).length) await db.ref().update(updates);
      setPowerSyncMsg(`Loaded ${matched} values from Mightpulse snapshot fetched ${new Date(MEMBER_POWER_SNAPSHOT.fetched_at).toLocaleString()}. Source boards may be older; — means unavailable in the top 100.`);
    } catch (e) { setPowerSyncMsg(`Snapshot could not be saved: ${e.message}`); }
